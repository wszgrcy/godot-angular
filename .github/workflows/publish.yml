name: publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  GODOTJS_TAG: v1.1.0.beta1-4.6.1

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            godotjs_asset: linux-editor-4.6.1-v8.zip
            godot_bin: bin/linux-editor-4.6.1-v8/godot.linuxbsd.editor.x86_64
          - name: windows
            os: windows-latest
            godotjs_asset: windows-editor-4.6.1-v8.zip
            godot_bin: bin/windows-editor-4.6.1-v8/godot.windows.editor.x86_64.exe

    steps:
      - name: pull-code
        uses: actions/checkout@v6

      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: install-node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: godot-engine
        shell: bash
        env:
          GODOTJS_ASSET: ${{ matrix.godotjs_asset }}
          GODOT_BIN_PATH: ${{ matrix.godot_bin }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godotjs.zip" \
            "https://github.com/godotjs/GodotJS/releases/download/${GODOTJS_TAG}/${GODOTJS_ASSET}"
          mkdir -p bin
          unzip -q "$RUNNER_TEMP/godotjs.zip" -d bin
          [ "$RUNNER_OS" = "Windows" ] || chmod +x "$GODOT_BIN_PATH"
          version="$("$GODOT_BIN_PATH" --headless --version | head -n1)"
          echo "GodotJS $version"

      - name: install-dependencies
        run: pnpm run setup:ci

      - name: typecheck
        run: pnpm run typecheck

      - name: check-schema
        run: pnpm run check:schema

      - name: test-node
        run: pnpm run test:node

      - name: test-engine
        run: pnpm run test:ci

  publish:
    name: publish
    needs: test
    runs-on: ubuntu-latest
    env:
      GODOTJS_ASSET: linux-editor-4.6.1-v8.zip
      GODOT_BIN_PATH: bin/linux-editor-4.6.1-v8/godot.linuxbsd.editor.x86_64

    steps:
      - name: init
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@gmail.com"

      - name: pull-code
        uses: actions/checkout@v6

      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: install-node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: godot-engine
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godotjs.zip" \
            "https://github.com/godotjs/GodotJS/releases/download/${GODOTJS_TAG}/${GODOTJS_ASSET}"
          mkdir -p bin
          unzip -q "$RUNNER_TEMP/godotjs.zip" -d bin
          chmod +x "$GODOT_BIN_PATH"
          version="$("$GODOT_BIN_PATH" --headless --version | head -n1)"
          echo "GodotJS $version"

      - name: install-dependencies
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm run gen:typings
          pnpm build

      - id: publish
        name: publish
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ./dist/package.json
          provenance: true
          access: public

      - if: steps.publish.outputs.old-version != steps.publish.outputs.version
        name: tag
        run: |
          echo "[${{ steps.publish.outputs.type }}]Version changed: ${{ steps.publish.outputs.old-version }} => ${{ steps.publish.outputs.version }}"
          git tag v${{ steps.publish.outputs.version }}
          git push origin v${{ steps.publish.outputs.version }}
