name: visual

# 像素级验证：开一个 Xvfb 虚拟显示，用 Mesa 的 lavapipe（软件 Vulkan）跑真窗口，
# 截图后统计节点画面区域内的颜色。断言与结论在 test-app/visual-out/report.txt。
#
# 与 publish.yml 分开的原因：这条链路需要显示环境和 Vulkan 设备，跟发布用的纯 headless
# 测试是两套前置条件，混在一起会让任一侧的偶发问题把另一侧也变红。

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOTJS_TAG: v1.1.0.beta1-4.6.1
  GODOTJS_ASSET: linux-editor-4.6.1-v8.zip
  # 必须是绝对路径：visual/run.sh 从 test-app/ 里执行，相对路径的基准不是仓库根
  GODOT_BIN_PATH: ${{ github.workspace }}/bin/linux-editor-4.6.1-v8/godot.linuxbsd.editor.x86_64

jobs:
  visual:
    name: pixel check (ubuntu + lavapipe)
    runs-on: ubuntu-latest

    steps:
      - name: pull-code
        uses: actions/checkout@v6

      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: install-node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      # Xvfb 提供 X 显示；mesa-vulkan-drivers 提供 lavapipe（CPU 实现的 Vulkan）。
      # runner 没有 GPU，但 lavapipe 报 Vulkan 1.4 / PHYSICAL_DEVICE_TYPE_CPU，已满足 Forward+
      # 的要求：本地强制只用 lavapipe 跑过，引擎输出 `Using Device #0: llvmpipe`，十二项
      # 像素断言全过（渲染耗时约 3 秒）。所以这里不需要改成 opengl3 / gl_compatibility：
      # 那个组合验的是没人发布的渲染器，而颜色断言是在 Forward+ 的 sRGB 转换下校准的。
      # 四个包各自的来源已用 dpkg -S / dpkg -c 核对：xvfb → Xvfb，x11-xserver-utils → xrandr
      #（注意不是 x11-utils），mesa-vulkan-drivers → lavapipe 的 ICD，vulkan-tools → vulkaninfo。
      # Vulkan loader（libvulkan1）由后两个包带进来，不用单独列。
      # 没列 libX11 / libGL 一类：GodotJS 的二进制是静态链接的（ldd 只有 libc/libm），
      # 这些库已经在里面，不是运行时动态依赖。
      - name: install-display-and-vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb
          x11-xserver-utils
          mesa-vulkan-drivers
          vulkan-tools

      - name: start-virtual-display
        run: |
          /usr/bin/Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # 断言里用了固定坐标（例如把鼠标移到 1200,700），显示比 1280x720 小的话坐标会落到窗口外。
      # xrandr 来自 x11-xserver-utils（不是 x11-utils），先查它在不在，避免报成
      # "command not found" 看不出原因。
      - name: check-display-size
        run: |
          command -v xrandr >/dev/null || { echo "xrandr 不可用：x11-xserver-utils 没装上" >&2; exit 1; }
          xrandr --query | tee /tmp/xrandr.txt
          grep -q "1280x720" /tmp/xrandr.txt

      # 提前失败：没有 Vulkan 设备时 Godot 报的是"创建表面失败"一类的间接错误，
      # 看不出是环境缺驱动。这里直接查设备并给出明确结论。
      - name: check-vulkan-device
        run: |
          command -v vulkaninfo >/dev/null || { echo "vulkaninfo 不可用：vulkan-tools 没装上" >&2; exit 1; }
          vulkaninfo --summary | tee /tmp/vulkaninfo.txt
          grep -q "deviceName" /tmp/vulkaninfo.txt || {
            echo "没有可用的 Vulkan 设备：lavapipe 未生效，无法运行像素级验证" >&2
            exit 1
          }

      - name: godot-engine
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godotjs.zip" \
            "https://github.com/godotjs/GodotJS/releases/download/${GODOTJS_TAG}/${GODOTJS_ASSET}"
          mkdir -p bin
          unzip -q "$RUNNER_TEMP/godotjs.zip" -d bin
          chmod +x "$GODOT_BIN_PATH"
          version="$("$GODOT_BIN_PATH" --headless --version | head -n1)"
          echo "GodotJS $version"

      - name: install-dependencies
        run: |
          pnpm i
          pnpm run gen:typings

      - name: run-visual-check
        env:
          GODOT: ${{ env.GODOT_BIN_PATH }}
          # 这里显式写死而不是依赖 run.sh 的默认值：本工作流验的就是 Vulkan 路径（靠 lavapipe
          # 用 CPU 实现）。以后就算脚本里的默认值改了，也不应该静默改变 CI 的验证对象。
          RENDERING_DRIVER: vulkan
        run: pnpm run test:visual

      # 报告和截图无论通过与否都上传：失败时这两样就是唯一的现场信息。
      - name: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-out
          path: test-app/visual-out/
          if-no-files-found: warn
          retention-days: 14
